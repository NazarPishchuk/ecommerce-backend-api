services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecommerce-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: ecommerce-seq

    ports:
      - "5341:80"

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: admin
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?SEQ_ADMIN_PASSWORD is required}
      SEQ_FIRSTRUN_REQUIREAUTHENTICATIONFORHTTPINGESTION: "true"

    volumes:
      - seq_data:/data

    restart: unless-stopped

volumes:
  rabbitmq_data:
  seq_data: